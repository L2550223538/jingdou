
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalTradeCRM - 本地单机增强版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.330.0"
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      LayoutDashboard, Users, Globe, Briefcase, BarChart2, Settings,
      Search, Bell, Plus, MessageCircle, Mail, Phone, ChevronLeft,
      CheckCircle2, AlertCircle, Clock, X, Save, Download, Upload, Trash2,
      Tag, Trello, List, Edit2
    } from 'lucide-react';

    // ==========================================
    // UTILS & HELPERS
    // ==========================================
    const generateId = () => Math.random().toString(36).substr(2, 9);

    const getTodayStr = () => {
      const tzOffset = (new Date()).getTimezoneOffset() * 60000;
      return (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
    };

    const isOverdue = (nextFollowUp, stage) => {
      if (!nextFollowUp || stage === '已成交' || stage === '已流失') return false;
      return nextFollowUp < getTodayStr();
    };

    const isDormant = (customer, timeline) => {
      if (customer.stage === '已成交' || customer.stage === '已流失') return false;
      if (customer.level !== 'A(核心)' && customer.level !== 'B(重点)') return false;

      const custTimeline = timeline.filter(t => t.customerId === customer.id);
      if (custTimeline.length === 0) return true; // No interactions

      const lastDate = new Date(custTimeline[0].date).getTime(); // Assuming sorted desc
      const daysSince = (Date.now() - lastDate) / (1000 * 3600 * 24);
      return daysSince > 30;
    };

    const parseAmount = (amountStr) => {
      if (!amountStr) return 0;
      const clean = amountStr.toString().replace(/[^0-9.-]+/g, "");
      return parseFloat(clean) || 0;
    };

    const ALL_TAGS = ['VIP', '价格敏感', '决策慢', '优质客户', '广交会', '重点跟进'];
    const CURRENCIES = ['USD', 'EUR', 'CNY', 'GBP'];

    const StatusBadge = ({ stage }) => {
      const colors = {
        '未联系': 'bg-gray-100 text-gray-600',
        '初步沟通': 'bg-blue-100 text-blue-600',
        '已报价': 'bg-yellow-100 text-yellow-700',
        '样品阶段': 'bg-purple-100 text-purple-600',
        '已成交': 'bg-green-100 text-green-600',
        '已流失': 'bg-red-100 text-red-600',
      };
      return (
        <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${colors[stage] || 'bg-gray-100 text-gray-600'}`}>
          {stage}
        </span>
      );
    };

    // ==========================================
    // DATA LAYER (LocalStorage)
    // ==========================================
    const useCRMData = () => {
      const [data, setData] = useState(() => {
        const stored = localStorage.getItem('crm_data_v2');
        if (stored) {
          try { return JSON.parse(stored); } catch(e) { console.error("Failed to parse local data", e); }
        }
        return { customers: [], contacts: [], orders: [], timeline: [] };
      });

      useEffect(() => {
        localStorage.setItem('crm_data_v2', JSON.stringify(data));
      }, [data]);

      const addCustomer = (customer) => {
        const newCustomer = { id: generateId(), createdAt: new Date().toISOString(), tags: [], ...customer };
        setData(prev => ({ ...prev, customers: [newCustomer, ...prev.customers] }));
        return newCustomer;
      };

      const updateCustomer = (id, updates) => {
        setData(prev => ({
          ...prev,
          customers: prev.customers.map(c => c.id === id ? { ...c, ...updates } : c)
        }));
      };

      const deleteCustomer = (id) => {
        setData(prev => ({
          ...prev,
          customers: prev.customers.filter(c => c.id !== id),
          contacts: prev.contacts.filter(c => c.customerId !== id),
          orders: prev.orders.filter(o => o.customerId !== id),
          timeline: prev.timeline.filter(t => t.customerId !== id)
        }));
      };

      const addContact = (contact) => {
         setData(prev => ({ ...prev, contacts: [{ id: generateId(), createdAt: new Date().toISOString(), ...contact }, ...prev.contacts] }));
      };

      const addOrder = (order) => {
         const newOrder = { id: generateId(), createdAt: new Date().toISOString(), ...order };
         setData(prev => ({ ...prev, orders: [newOrder, ...prev.orders] }));
         return newOrder;
      };

      const updateOrder = (id, updates) => {
         setData(prev => ({ ...prev, orders: prev.orders.map(o => o.id === id ? { ...o, ...updates } : o) }));
      };

      const addTimeline = (timelineItem) => {
         setData(prev => {
            const newTimeline = [{ id: generateId(), createdAt: new Date().toISOString(), ...timelineItem }, ...prev.timeline];
            // Sort desc by date
            newTimeline.sort((a, b) => new Date(b.date) - new Date(a.date));
            return { ...prev, timeline: newTimeline };
         });
      };

      const importData = (jsonData) => setData(jsonData);
      const clearData = () => setData({ customers: [], contacts: [], orders: [], timeline: [] });


      const deleteContact = (id) => setData(prev => ({ ...prev, contacts: prev.contacts.filter(c => c.id !== id) }));
      const deleteTimeline = (id) => setData(prev => ({ ...prev, timeline: prev.timeline.filter(t => t.id !== id) }));
      return { data, addCustomer, updateCustomer, deleteCustomer, addContact, deleteContact, addOrder, updateOrder, addTimeline, deleteTimeline, importData, clearData };

    };

    // ==========================================
    // MODALS (Extracted out of main component)
    // ==========================================
    const Toast = ({ toast }) => {
      if (!toast) return null;
      return (
        <div className={`fixed top-4 right-4 z-[999] px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 transform transition-all duration-300 ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'}`}>
          {toast.type === 'error' ? <AlertCircle className="w-5 h-5" /> : <CheckCircle2 className="w-5 h-5" />}
          <span className="font-medium text-sm">{toast.message}</span>
        </div>
      );
    };

    const AddCustomerModal = ({ isOpen, onClose, onSave, ALL_TAGS, editingCustomer }) => {
      const [socialInputs, setSocialInputs] = useState([{ platform: 'WhatsApp', account: '' }]);
      const [selectedTags, setSelectedTags] = useState([]);

      useEffect(() => {
         if (isOpen && editingCustomer) {
            setSocialInputs(editingCustomer.socialMedia?.length ? editingCustomer.socialMedia : [{ platform: 'WhatsApp', account: '' }]);
            setSelectedTags(editingCustomer.tags || []);
         } else if (isOpen) {
            setSocialInputs([{ platform: 'WhatsApp', account: '' }]);
            setSelectedTags([]);
         }
      }, [isOpen, editingCustomer]);

      if (!isOpen) return null;

      const handleAddSocial = () => setSocialInputs([...socialInputs, { platform: 'WhatsApp', account: '' }]);
      const handleRemoveSocial = (index) => setSocialInputs(socialInputs.filter((_, i) => i !== index));
      const handleSocialChange = (index, field, value) => {
        const newSocials = [...socialInputs];
        newSocials[index][field] = value;
        setSocialInputs(newSocials);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const socialMedia = socialInputs.filter(s => s.account.trim() !== '');

        const newCustomer = {
          ...(editingCustomer || {}), // Keep existing ID, createdAt, stage, etc if editing
          name: formData.get('name'),
          country: formData.get('country'),
          website: formData.get('website') || '',
          socialMedia,
          source: formData.get('source'),
          level: formData.get('level'),
          stage: editingCustomer ? editingCustomer.stage : '未联系',
          lastFollowUp: editingCustomer ? editingCustomer.lastFollowUp : '-',
          nextFollowUp: formData.get('nextFollowUp') || '',
          owner: 'Admin',
          tags: selectedTags
        };
        onSave(newCustomer);
        setSocialInputs([{ platform: 'WhatsApp', account: '' }]);
        setSelectedTags([]);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden max-h-[90vh] flex flex-col">
            <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center shrink-0">
              <h3 className="font-bold text-lg text-gray-800">{editingCustomer ? '编辑客户资料' : '新增客户'}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button>
            </div>
            <div className="overflow-y-auto flex-1 p-6">
              <form id="addCustomerForm" onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">客户名称 *</label>
                  <input required name="name" defaultValue={editingCustomer?.name || ''} type="text" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="如: AutoParts GmbH" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">企业官网</label>
                  <input name="website" defaultValue={editingCustomer?.website || ''} type="text" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="如: www.example.com" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">社媒账号</label>
                  <div className="space-y-2">
                    {socialInputs.map((social, index) => (
                      <div key={index} className="flex gap-2">
                        <select value={social.platform} onChange={(e) => handleSocialChange(index, 'platform', e.target.value)} className="w-1/3 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                          <option value="WhatsApp">WhatsApp</option>
                          <option value="WeChat">WeChat</option>
                          <option value="LinkedIn">LinkedIn</option>
                          <option value="Skype">Skype</option>
                          <option value="其他">其他</option>
                        </select>
                        <input type="text" value={social.account} onChange={(e) => handleSocialChange(index, 'account', e.target.value)} className="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="账号/链接" />
                        {socialInputs.length > 1 && (
                          <button type="button" onClick={() => handleRemoveSocial(index)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg"><X className="w-4 h-4" /></button>
                        )}
                      </div>
                    ))}
                    <button type="button" onClick={handleAddSocial} className="text-sm text-blue-600 font-medium flex items-center gap-1 hover:text-blue-700"><Plus className="w-3.5 h-3.5" /> 添加社媒</button>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">国家/地区</label>
                    <input name="country" defaultValue={editingCustomer?.country || ''} type="text" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">客户等级</label>
                    <select name="level" defaultValue={editingCustomer?.level || 'C(普通)'} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                      <option value="A(核心)">A(核心)</option>
                      <option value="B(重点)">B(重点)</option>
                      <option value="C(普通)">C(普通)</option>
                      <option value="D(潜在)">D(潜在)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">客户标签</label>
                  <div className="flex flex-wrap gap-2">
                    {ALL_TAGS.map(tag => (
                      <button
                        type="button"
                        key={tag}
                        onClick={() => setSelectedTags(prev => prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag])}
                        className={`px-2 py-1 rounded text-xs font-medium border ${selectedTags.includes(tag) ? 'bg-blue-100 border-blue-200 text-blue-700' : 'bg-gray-50 border-gray-200 text-gray-600 hover:bg-gray-100'}`}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">客户来源</label>
                    <select name="source" defaultValue={editingCustomer?.source || '官网'} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                      <option value="展会">展会</option>
                      <option value="官网">官网</option>
                      <option value="Alibaba">Alibaba</option>
                      <option value="Google开发">Google开发</option>
                      <option value="其他">其他</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">下次提醒</label>
                    <input name="nextFollowUp" defaultValue={editingCustomer?.nextFollowUp || ''} type="date" className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                  </div>
                </div>
              </form>
            </div>
            <div className="px-6 py-4 border-t border-gray-100 flex gap-3 justify-end shrink-0">
              <button type="button" onClick={onClose} className="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">取消</button>
              <button type="submit" form="addCustomerForm" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 flex items-center gap-2"><Save className="w-4 h-4" /> 保存</button>
            </div>
          </div>
        </div>
      );
    };

    const AddContactModal = ({ isOpen, onClose, onSave, customerId }) => {
      if (!isOpen) return null;
      const handleSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        onSave({
          customerId,
          name: formData.get('name'),
          title: formData.get('title'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          isPrimary: formData.get('isPrimary') === 'on'
        });
      };
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
              <h3 className="font-bold text-lg text-gray-800">新增联系人</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div><label className="block text-sm mb-1">姓名 *</label><input required name="name" className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
              <div><label className="block text-sm mb-1">职位</label><input name="title" className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm mb-1">邮箱</label><input name="email" type="email" className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
                <div><label className="block text-sm mb-1">电话</label><input name="phone" className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
              </div>
              <div className="pt-2"><label className="flex items-center gap-2 text-sm"><input name="isPrimary" type="checkbox" className="rounded" defaultChecked />设为首要联系人</label></div>
              <div className="pt-4 flex gap-3 justify-end">
                <button type="button" onClick={onClose} className="px-4 py-2 border rounded-lg text-sm">取消</button>
                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">保存</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    const AddQuoteModal = ({ isOpen, onClose, onSave, editingQuote, customerId, customerName, CURRENCIES }) => {
      if (!isOpen) return null;
      const todayStr = getTodayStr();

      const handleSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        onSave({
          id: editingQuote?.id,
          customerId: editingQuote ? editingQuote.customerId : customerId,
          customerName: editingQuote ? editingQuote.customerName : customerName,
          type: formData.get('type'),
          currency: formData.get('currency'),
          amount: formData.get('amount'),
          date: formData.get('date'),
          status: formData.get('status'),
          product: formData.get('product')
        });
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center">
              <h3 className="font-bold text-lg text-gray-800">{editingQuote ? '编辑单据' : '录入单据'}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm mb-1">类型</label>
                  <select name="type" defaultValue={editingQuote?.type || '报价单'} className="w-full border rounded-lg px-3 py-2 text-sm bg-white">
                    <option>报价单</option><option>样品单</option><option>订单</option>
                  </select>
                </div>
                <div>
                  <label className="block text-sm mb-1">状态</label>
                  <select name="status" defaultValue={editingQuote?.status || '待客户确认'} className="w-full border rounded-lg px-3 py-2 text-sm bg-white">
                    <option>待客户确认</option><option>已确认</option><option>生产中</option><option>已发货</option><option>已完结</option>
                  </select>
                </div>
              </div>
              <div><label className="block text-sm mb-1">关联产品/备注</label><input name="product" defaultValue={editingQuote?.product || ''} className="w-full border rounded-lg px-3 py-2 text-sm" /></div>

              <div className="flex gap-2">
                <div className="w-1/3">
                  <label className="block text-sm mb-1">币种</label>
                  <select name="currency" defaultValue={editingQuote?.currency || 'USD'} className="w-full border rounded-lg px-3 py-2 text-sm bg-white">
                    {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="flex-1">
                  <label className="block text-sm mb-1">金额</label>
                  <input required name="amount" defaultValue={editingQuote?.amount || ''} type="number" step="0.01" className="w-full border rounded-lg px-3 py-2 text-sm" />
                </div>
              </div>

              <div><label className="block text-sm mb-1">日期</label><input required name="date" type="date" defaultValue={editingQuote?.date || todayStr} className="w-full border rounded-lg px-3 py-2 text-sm" /></div>
              <div className="pt-4 flex gap-3 justify-end">
                <button type="button" onClick={onClose} className="px-4 py-2 border rounded-lg text-sm">取消</button>
                <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">保存</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // ==========================================
    // VIEWS
    // ==========================================
    const DashboardView = ({ data, actions, setActiveMenu, setSelectedCustomer }) => {
      const todayStr = getTodayStr();
      const currentMonthStr = todayStr.substring(0, 7);

      const stats = useMemo(() => {
        let monthOrderTotal = 0;
        data.orders.forEach(o => {
           if (o.date && o.date.startsWith(currentMonthStr) && (o.type === '订单' || o.status === '已完结')) {
              // Convert to roughly USD for display if needed, but we keep simple addition for now
              monthOrderTotal += parseAmount(o.amount);
           }
        });

        return {
          todayTasks: data.customers.filter(c => c.nextFollowUp === todayStr && c.stage !== '已成交').length,
          overdue: data.customers.filter(c => isOverdue(c.nextFollowUp, c.stage)).length,
          newLeads: data.customers.filter(c => c.createdAt && c.createdAt.startsWith(currentMonthStr)).length,
          thisMonthOrders: monthOrderTotal
        };
      }, [data, todayStr, currentMonthStr]);

      const actionTasks = data.customers.filter(c => c.nextFollowUp === todayStr || isOverdue(c.nextFollowUp, c.stage) || isDormant(c, data.timeline));

      return (
        <div className="p-6 max-w-7xl mx-auto h-full overflow-auto">
          <h1 className="text-2xl font-bold text-gray-800 mb-6">工作台</h1>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm flex justify-between">
              <div><p className="text-sm font-medium text-gray-500 mb-1">今日待联系</p><h3 className="text-3xl font-bold text-blue-600">{stats.todayTasks}</h3></div>
              <div className="p-3 rounded-lg bg-blue-50"><Clock className="w-6 h-6 text-blue-600" /></div>
            </div>
            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm flex justify-between">
              <div><p className="text-sm font-medium text-gray-500 mb-1">逾期/风险客户</p><h3 className="text-3xl font-bold text-red-600">{stats.overdue}</h3></div>
              <div className="p-3 rounded-lg bg-red-50"><AlertCircle className="w-6 h-6 text-red-600" /></div>
            </div>
            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm flex justify-between">
              <div><p className="text-sm font-medium text-gray-500 mb-1">本月新增</p><h3 className="text-3xl font-bold text-green-600">{stats.newLeads}</h3></div>
              <div className="p-3 rounded-lg bg-green-50"><Users className="w-6 h-6 text-green-600" /></div>
            </div>
            <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm flex justify-between">
              <div><p className="text-sm font-medium text-gray-500 mb-1">本月成交估算</p><h3 className="text-3xl font-bold text-purple-600">{stats.thisMonthOrders.toLocaleString()}</h3></div>
              <div className="p-3 rounded-lg bg-purple-50"><CheckCircle2 className="w-6 h-6 text-purple-600" /></div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white rounded-xl border shadow-sm flex flex-col">
              <div className="p-5 border-b flex justify-between items-center">
                <h3 className="font-bold flex items-center gap-2"><Bell className="w-4 h-4 text-orange-500"/> 待办与预警</h3>
              </div>
              <div className="divide-y overflow-y-auto max-h-[500px]">
                {actionTasks.length === 0 ? (

                    <div key={level} className={`p-4 rounded-lg border ${idx === 0 ? 'bg-red-50 border-red-100' : idx === 1 ? 'bg-orange-50 border-orange-100' : idx === 2 ? 'bg-blue-50 border-blue-100' : 'bg-gray-50 border-gray-200'}`}>
                      <div className="text-xs font-bold text-gray-500 mb-1">{level}</div>
                      <div className={`text-2xl font-black ${idx === 0 ? 'text-red-600' : idx === 1 ? 'text-orange-600' : idx === 2 ? 'text-blue-600' : 'text-gray-600'}`}>{count}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <h3 className="font-bold text-gray-800 mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                  <MessageCircle className="w-5 h-5 text-green-600" /> 团队跟进动作统计
                </h3>
                <div className="flex justify-around items-end h-32 pt-4">
                  {Object.entries(commStats).map(([type, count]) => (
                    <div key={type} className="flex flex-col items-center gap-2 w-1/4">
                      <span className="text-xs font-bold text-gray-500">{count}次</span>
                      <div className="w-12 bg-green-100 rounded-t-md relative overflow-hidden flex flex-col justify-end h-24">
                        <div
                          className="w-full bg-green-500 transition-all duration-1000 ease-out"
                          style={{ height: `${Math.max(...Object.values(commStats)) === 0 ? 0 : (count / Math.max(...Object.values(commStats))) * 100}%` }}
                        ></div>
                      </div>
                      <span className="text-xs font-medium text-gray-600">{type}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const SettingsView = ({ data, actions }) => {
      const handleExport = () => {
         const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
         const url = URL.createObjectURL(blob);
         const a = document.createElement('a');
         a.href = url;
         a.download = `GlobalTradeCRM_Backup_${getTodayStr()}.json`;
         a.click();
         URL.revokeObjectURL(url);
         actions.showToast("数据已导出为 JSON 文件");
      };

      const handleImport = (e) => {
         const file = e.target.files[0];
         if(!file) return;
         const reader = new FileReader();
         reader.onload = (event) => {
            try {
               const json = JSON.parse(event.target.result);
               if(json.customers) {
                  actions.importData(json);
                  actions.showToast("数据导入成功");
               } else {
                  actions.showToast("无效的数据格式", "error");
               }
            } catch(err) {
               actions.showToast("解析 JSON 失败", "error");
            }
         };
         reader.readAsText(file);
      };

      const handleClear = () => {
         if(window.confirm("确定要清空所有本地数据吗？此操作不可逆！建议先导出备份。")) {
            actions.clearData();
            actions.showToast("系统数据已清空");
         }
      };

      return (
         <div className="p-6 max-w-3xl mx-auto h-full">
            <h1 className="text-2xl font-bold text-gray-800 mb-6">系统设置与数据管理</h1>
            <div className="bg-white rounded-xl border shadow-sm p-6 space-y-8">

               <div>
                  <h3 className="font-bold text-lg mb-2 flex items-center gap-2"><Download className="w-5 h-5 text-blue-600"/> 数据备份 (导出)</h3>
                  <p className="text-sm text-gray-500 mb-4">将当前所有的客户、订单、跟进记录导出为纯文本 JSON 文件，方便你在其他电脑恢复或永久存档。</p>
                  <button onClick={handleExport} className="px-4 py-2 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg font-medium hover:bg-blue-100 transition-colors">导出 data.json</button>
               </div>

               <div className="border-t pt-6">
                  <h3 className="font-bold text-lg mb-2 flex items-center gap-2"><Upload className="w-5 h-5 text-green-600"/> 数据恢复 (导入)</h3>
                  <p className="text-sm text-gray-500 mb-4">从本地 JSON 文件中恢复数据。注意：这将覆盖当前系统内的所有数据。</p>
                  <label className="px-4 py-2 bg-green-50 text-green-700 border border-green-200 rounded-lg font-medium hover:bg-green-100 cursor-pointer transition-colors inline-block">
                     选择文件并导入
                     <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                  </label>
               </div>

               <div className="border-t pt-6">
                  <h3 className="font-bold text-lg mb-2 flex items-center gap-2 text-red-600"><Trash2 className="w-5 h-5"/> 危险操作</h3>
                  <p className="text-sm text-gray-500 mb-4">清除浏览器的所有本地缓存数据。如果你的系统由于脏数据卡死，可以使用此功能。</p>
                  <button onClick={handleClear} className="px-4 py-2 bg-red-50 text-red-700 border border-red-200 rounded-lg font-medium hover:bg-red-100 transition-colors">清空所有数据</button>
               </div>

            </div>
         </div>
      );
    };

    // ==========================================
    // MAIN APP
    // ==========================================
    const GlobalTradeCRM = () => {
      const { data, ...dataActions } = useCRMData();
      const [activeMenu, setActiveMenu] = useState('dashboard');
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [toast, setToast] = useState(null);

      // Modal states
      const [isAddCustOpen, setAddCustOpen] = useState(false);
      const [contactModalArgs, setContactModalArgs] = useState(null); // null means closed
      const [quoteModalArgs, setQuoteModalArgs] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };


      const [editingCustomer, setEditingCustomer] = useState(null);
      const actions = {
        ...dataActions,
        showToast,
        openAddCustomer: () => { setEditingCustomer(null); setAddCustOpen(true); },
        openEditCustomer: (c) => { setEditingCustomer(c); setAddCustOpen(true); }
      };

      return (
        <div className="flex h-screen bg-gray-50">
          <Toast toast={toast} />

          <AddCustomerModal
             isOpen={isAddCustOpen} onClose={() => setAddCustOpen(false)} ALL_TAGS={ALL_TAGS} editingCustomer={editingCustomer}
             onSave={(c) => {
             if (c.id) { actions.updateCustomer(c.id, c); showToast("客户资料已更新"); }
             else { actions.addCustomer(c); showToast("客户录入成功"); }
             setAddCustOpen(false);
          }}
          />
          <AddContactModal
             isOpen={!!contactModalArgs} onClose={() => setContactModalArgs(null)} customerId={contactModalArgs}
             onSave={(c) => { actions.addContact(c); setContactModalArgs(null); showToast("联系人已保存"); }}
          />
          <AddQuoteModal
             isOpen={!!quoteModalArgs} onClose={() => setQuoteModalArgs(null)} CURRENCIES={CURRENCIES}
             editingQuote={quoteModalArgs?.quote} customerId={quoteModalArgs?.customer?.id} customerName={quoteModalArgs?.customer?.name}
             onSave={(q) => {
                const prefix = q.type === '报价单' ? 'QUO' : q.type === '订单' ? 'ORD' : 'SMP';
                let displayId = q.id ? q.displayId : `${prefix}-${Date.now().toString().slice(-6)}`;

                if(q.id) {
                    actions.updateOrder(q.id, q);
                } else {
                    actions.addOrder({ ...q, displayId });
                }

                // Sync to timeline
                actions.addTimeline({
                    customerId: q.customerId,
                    type: 'system',
                    date: new Date().toISOString(),
                    title: q.id ? `修改${q.type}: ${displayId}` : `录入${q.type}: ${displayId}`,
                    content: `总金额: ${q.currency} ${q.amount}
状态: ${q.status}
关联产品: ${q.product || '无'}`,
                    user: 'Admin'
                });

                actions.updateCustomer(q.customerId, { stage: q.type==='报价单'?'已报价':q.type==='订单'?'已成交':'样品阶段' });

                // If viewing this customer, update local ref
                setSelectedCustomer(prev => prev && prev.id === q.customerId ? { ...prev, stage: q.type==='报价单'?'已报价':q.type==='订单'?'已成交':'样品阶段' } : prev);

                setQuoteModalArgs(null);
                showToast("单据已保存并同步至跟进动态");
             }}
          />

          <div className="w-64 bg-white border-r flex flex-col shrink-0 z-20 shadow-sm">
            <div className="p-5 flex items-center gap-3 border-b"><div className="w-8 h-8 bg-blue-600 rounded flex items-center justify-center"><Globe className="w-5 h-5 text-white"/></div><span className="font-bold text-xl">GlobalTrade</span></div>
            <div className="flex-1 py-4 space-y-1 px-3">
              {[
                { id: 'dashboard', label: '工作台', icon: LayoutDashboard },
                { id: 'customers', label: '我的客户', icon: Users },
                { id: 'quotes', label: '报价与订单', icon: Briefcase },
                { id: 'stats', label: '数据看板', icon: BarChart2 },
                { id: 'settings', label: '系统设置', icon: Settings }
              ].map(item => (
                <div key={item.id} onClick={() => { setActiveMenu(item.id); setSelectedCustomer(null); }} className={`flex items-center px-4 py-3 cursor-pointer rounded-lg transition-colors ${activeMenu === item.id && !selectedCustomer ? 'bg-blue-50 text-blue-600 font-bold' : 'text-gray-600 hover:bg-gray-100'}`}>
                  <item.icon className="w-5 h-5 mr-3" /> <span className="text-sm">{item.label}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="flex-1 flex flex-col overflow-hidden relative">
            <header className="bg-white h-16 border-b flex items-center justify-end px-6 shrink-0 shadow-sm">
              <div className="flex items-center gap-3"><div className="w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-sm">A</div><span className="text-sm font-bold">Admin</span></div>
            </header>
            <main className="flex-1 overflow-hidden relative">
              {selectedCustomer ? <CustomerDetailView
                customer={data.customers.find(c => c.id === selectedCustomer.id) || selectedCustomer}
                data={data}
                actions={{...actions, updateCustomer: (id, updates) => { actions.updateCustomer(id, updates); setSelectedCustomer(prev => prev.id === id ? {...prev, ...updates} : prev); }}}
                onBack={()=>setSelectedCustomer(null)} openAddQuote={(q, c) => setQuoteModalArgs({quote:q, customer:c})} openAddContact={id => setContactModalArgs(id)} />
               : activeMenu === 'dashboard' ? <DashboardView data={data} actions={actions} setActiveMenu={setActiveMenu} setSelectedCustomer={setSelectedCustomer} />
               : activeMenu === 'customers' ? <CustomerListView data={data} actions={actions} setSelectedCustomer={setSelectedCustomer} />
               : activeMenu === 'quotes' ? <QuotesOrdersView data={data} setSelectedCustomer={setSelectedCustomer} openAddQuote={q => setQuoteModalArgs({quote:q})} />
               : activeMenu === 'stats' ? <StatsView data={data} />
               : activeMenu === 'settings' ? <SettingsView data={data} actions={actions} />
               : null}
            </main>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<GlobalTradeCRM />);
  </script>
</body>
</html>
